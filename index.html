<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JirafasCeliacas</title>
    <link rel="icon" type="image/png" href="jirafa.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            overflow-x: hidden;
        }

        /* Retícula asimétrica densa: celdas base finas para permitir proporciones muy variadas y orgánicas */
        .abstract-mosaic {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--cell-w, 95px), 1fr));
            grid-auto-rows: var(--cell-h, 75px);
            grid-auto-flow: dense;
            gap: var(--grid-gap, 8px);
            padding: var(--grid-gap, 8px);
            width: 100%;
            box-sizing: border-box;
        }

        /* Geometrías asimétricas: tiras finas, bloques alargados, panorámicas y torres */
        .shape-strip-h { grid-column: span 4; grid-row: span 1; }
        .shape-strip-v { grid-column: span 1; grid-row: span 4; }
        .shape-wide    { grid-column: span 3; grid-row: span 2; }
        .shape-tall    { grid-column: span 2; grid-row: span 4; }
        .shape-hero    { grid-column: span 4; grid-row: span 3; }
        .shape-pillar  { grid-column: span 1; grid-row: span 3; }
        .shape-banner  { grid-column: span 3; grid-row: span 1; }
        .shape-medium  { grid-column: span 2; grid-row: span 2; }
        .shape-compact { grid-column: span 2; grid-row: span 1; }
        .shape-sliver  { grid-column: span 1; grid-row: span 2; }

        /* Cortes abstractos sutiles y radios asimétricos para romper los ángulos rectos */
        .cut-a { border-radius: 28px 4px 24px 4px; }
        .cut-b { border-radius: 4px 32px 4px 28px; }
        .cut-c { clip-path: polygon(0 4%, 100% 0, 100% 96%, 0 100%); }
        .cut-d { clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%); }
        .cut-e { border-radius: 40px 40px 6px 6px; }
        .cut-f { border-radius: 6px 6px 40px 40px; }
        .cut-g { border-radius: 2px; }

        @media (max-width: 520px) {
            .shape-strip-h, .shape-hero { grid-column: span 3; }
            .shape-wide, .shape-banner  { grid-column: span 2; }
        }

        .tile {
            position: relative;
            overflow: hidden;
            background-color: #f4f4f5;
            cursor: zoom-in;
            opacity: 0;
            transform: scale(0.94);
            transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tile.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 15%;
            display: block;
            transition: transform 0.6s ease;
        }

        .tile:hover img {
            transform: scale(1.06);
        }

        /* Lightbox minimalista para imagen ampliada */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 12, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 24px;
        }

        #lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        #lightbox img {
            max-width: 92vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #lightbox.active img {
            transform: scale(1);
        }

        #lightbox-close {
            position: fixed;
            top: 20px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            z-index: 10000;
        }

        #lightbox-close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <main id="mosaic" class="abstract-mosaic"></main>
    <div id="scroll-sentinel" class="w-full h-32"></div>

    <!-- Vista ampliada al clicar una imagen -->
    <div id="lightbox" role="dialog" aria-modal="true">
        <button id="lightbox-close" aria-label="Cerrar imagen">&times;</button>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const mosaic = document.getElementById('mosaic');
        const sentinel = document.getElementById('scroll-sentinel');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxClose = document.getElementById('lightbox-close');

        function openLightbox(url) {
            lightboxImg.src = url;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => {
                if (!lightbox.classList.contains('active')) {
                    lightboxImg.src = '';
                }
            }, 300);
        }

        lightboxClose.addEventListener('click', (e) => {
            e.stopPropagation();
            closeLightbox();
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });

        let isLoadingBatch = false;
        let isFetchingMore = false;
        const giraffeUrls = [];
        const wheatUrls = [];
        const usedUrls = new Set();
        let nextTypeIsGiraffe = Math.random() < 0.5;

        const allShapes = [
            'shape-strip-h',
            'shape-strip-v',
            'shape-wide',
            'shape-tall',
            'shape-hero',
            'shape-pillar',
            'shape-banner',
            'shape-medium',
            'shape-compact',
            'shape-sliver'
        ];

        const allCuts = ['cut-a', 'cut-b', 'cut-c', 'cut-d', 'cut-e', 'cut-f', 'cut-g'];
        let sessionShapes = [...allShapes];
        let sessionCuts = [...allCuts];
        let lastShape = '';

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function randomizeSessionLayout() {
            const cellW = Math.floor(Math.random() * 45) + 75;
            const cellH = Math.floor(Math.random() * 35) + 60;
            const gap = Math.floor(Math.random() * 10) + 4;

            mosaic.style.setProperty('--cell-w', `${cellW}px`);
            mosaic.style.setProperty('--cell-h', `${cellH}px`);
            mosaic.style.setProperty('--grid-gap', `${gap}px`);

            sessionShapes = [...allShapes];
            sessionCuts = [...allCuts];
            shuffle(sessionShapes);
            shuffle(sessionCuts);
        }

        // Agrega solo URLs válidas de jirafas o trigo/gluten según el tipo solicitado
        function registerPages(pages, type) {
            if (!pages) return;
            const targetPool = type === 'giraffe' ? giraffeUrls : wheatUrls;
            let added = 0;

            for (const page of Object.values(pages)) {
                const info = page.imageinfo?.[0];
                if (!info || (info.width || 0) < 400) continue;

                const rawUrl = info.thumburl || info.url;
                if (typeof rawUrl !== 'string') continue;

                const cleanUrl = rawUrl.split('#')[0];
                const title = page.title || '';

                const commonExcluded = /(logo|icon|map|range|distribution|diagram|skull|skeleton|stamp|flag|svg|banner|statue|toy|plush|drawing|painting|illustration|cartoon|art|mural|coin|chart|graph|table|text|document)/i.test(title);
                if (commonExcluded) continue;

                let matchesType = false;
                if (type === 'giraffe') {
                    const isGiraffe = /(giraffe|giraffa|camelopardalis|girafe|jirafa)/i.test(title);
                    const isGiraffeExcluded = /(zebra|elephant|lion|ostrich|okapi|impala|wildebeest|antelope|rhino|hippo|buffalo|cheetah|leopard|hyena|monkey|baboon|bird|vulture|stork|landscape|savanna|herd|distant|far|tracks|footprint|dung|poop)/i.test(title);
                    matchesType = isGiraffe && !isGiraffeExcluded;
                } else {
                    const isWheat = /(wheat|triticum|trigo|blé|weizen|grano|espiga)/i.test(title);
                    const isWheatExcluded = /(gluten-free|sin_gluten|tractor|machine|combine|factory|building|person|portrait|man|woman|child|hand|tableware|menu|bread|cake|pizza|pasta|croissant)/i.test(title);
                    matchesType = isWheat && !isWheatExcluded;
                }

                if (
                    cleanUrl.startsWith('https://') &&
                    /\.(jpe?g|png|webp)(\?.*)?$/i.test(cleanUrl) &&
                    matchesType &&
                    !usedUrls.has(cleanUrl) &&
                    !targetPool.includes(cleanUrl)
                ) {
                    targetPool.push(cleanUrl);
                    added++;
                }
            }
            if (added > 0) {
                shuffle(targetPool);
            }
        }

        // Consulta categorías exclusivas de jirafas y de trigo/gluten en Wikimedia Commons
        async function fetchMoreMedia() {
            if (isFetchingMore) return;
            isFetchingMore = true;

            const giraffeCategories = [
                'Category:Giraffe_portraits',
                'Category:Giraffe_heads',
                'Category:Giraffa_camelopardalis_reticulata',
                'Category:Giraffa_camelopardalis_tippelskirchi',
                'Category:Giraffa_camelopardalis_rothschildi',
                'Category:Giraffa_camelopardalis_angolensis',
                'Category:Giraffa_camelopardalis_giraffa',
                'Category:Giraffes_feeding',
                'Category:Giraffes_in_zoos',
                'Category:Giraffa_camelopardalis'
            ];

            const wheatCategories = [
                'Category:Wheat',
                'Category:Wheat_ears',
                'Category:Wheat_grains',
                'Category:Wheat_fields',
                'Category:Triticum_aestivum',
                'Category:Triticum_durum',
                'Category:Harvested_wheat',
                'Category:Wheat_spikelets'
            ];

            const giraffeQueries = [
                'Giraffe portrait',
                'Giraffe head',
                'Giraffe face',
                'Giraffe closeup',
                'Giraffa camelopardalis'
            ];

            const wheatQueries = [
                'Wheat ears',
                'Wheat grain',
                'Golden wheat field',
                'Triticum aestivum',
                'Wheat harvest',
                'Wheat stalks'
            ];

            const gCat = giraffeCategories[Math.floor(Math.random() * giraffeCategories.length)];
            const wCat = wheatCategories[Math.floor(Math.random() * wheatCategories.length)];
            const gQuery = giraffeQueries[Math.floor(Math.random() * giraffeQueries.length)];
            const wQuery = wheatQueries[Math.floor(Math.random() * wheatQueries.length)];
            const randomOffset = Math.floor(Math.random() * 50);

            const requests = [
                // Jirafas (Categoría + Búsqueda)
                fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=${encodeURIComponent(gCat)}&gcmtype=file&gcmlimit=50&prop=imageinfo&iiprop=url|size&iiurlwidth=800&format=json&origin=*`)
                    .then(r => r.json())
                    .then(data => registerPages(data?.query?.pages, 'giraffe'))
                    .catch(() => {}),

                fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=filetype:bitmap+intitle:Giraffe+${encodeURIComponent(gQuery)}&gsrnamespace=6&gsrlimit=50&gsroffset=${randomOffset}&prop=imageinfo&iiprop=url|size&iiurlwidth=800&format=json&origin=*`)
                    .then(r => r.json())
                    .then(data => registerPages(data?.query?.pages, 'giraffe'))
                    .catch(() => {}),

                // Trigo y Gluten (Categoría + Búsqueda)
                fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=${encodeURIComponent(wCat)}&gcmtype=file&gcmlimit=50&prop=imageinfo&iiprop=url|size&iiurlwidth=800&format=json&origin=*`)
                    .then(r => r.json())
                    .then(data => registerPages(data?.query?.pages, 'wheat'))
                    .catch(() => {}),

                fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=filetype:bitmap+${encodeURIComponent(wQuery)}&gsrnamespace=6&gsrlimit=50&gsroffset=${randomOffset}&prop=imageinfo&iiprop=url|size&iiurlwidth=800&format=json&origin=*`)
                    .then(r => r.json())
                    .then(data => registerPages(data?.query?.pages, 'wheat'))
                    .catch(() => {})
            ];

            await Promise.all(requests);
            isFetchingMore = false;
        }

        // Extrae alternando 50% jirafas y 50% trigo/gluten sin repetir URLs
        function popUniqueItem() {
            if (giraffeUrls.length < 15 || wheatUrls.length < 15) {
                fetchMoreMedia();
            }

            const primaryType = nextTypeIsGiraffe ? 'giraffe' : 'wheat';
            const secondaryType = nextTypeIsGiraffe ? 'wheat' : 'giraffe';
            nextTypeIsGiraffe = !nextTypeIsGiraffe;

            for (const type of [primaryType, secondaryType]) {
                const pool = type === 'giraffe' ? giraffeUrls : wheatUrls;
                while (pool.length > 0) {
                    const candidate = pool.pop();
                    if (!usedUrls.has(candidate)) {
                        usedUrls.add(candidate);
                        return { url: candidate, type };
                    }
                }
            }
            return null;
        }

        // Elige una forma distinta a la anterior para evitar repeticiones visuales seguidas
        function pickAbstractShape() {
            let shape = sessionShapes[Math.floor(Math.random() * sessionShapes.length)];
            if (shape === lastShape) {
                shape = sessionShapes[(sessionShapes.indexOf(shape) + 1) % sessionShapes.length];
            }
            lastShape = shape;
            const cut = sessionCuts[Math.floor(Math.random() * sessionCuts.length)];
            return `${shape} ${cut}`;
        }

        // Detecta en un canvas reducido dónde se concentra la parte superior de la jirafa (tonos cálidos/ocres)
        // para centrar el encuadre exactamente en la cabeza y cuello superior
        function detectGiraffeHeadFocalPoint(img) {
            try {
                const canvas = document.createElement('canvas');
                const size = 48;
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(img, 0, 0, size, size);
                const data = ctx.getImageData(0, 0, size, size).data;

                let topMostY = size;
                let sumX = 0;
                let count = 0;

                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];

                        // Tonos cálidos/ocres/marrones típicos del pelaje de la jirafa
                        if (r > 95 && g > 55 && r > g * 1.15 && g > b * 1.15) {
                            if (y < topMostY) topMostY = y;
                            if (y <= topMostY + 12) {
                                sumX += x;
                                count++;
                            }
                        }
                    }
                }

                if (count > 5) {
                    const posX = Math.min(85, Math.max(15, Math.round((sumX / count / size) * 100)));
                    const posY = Math.min(35, Math.max(5, Math.round((topMostY / size) * 100) + 4));
                    return `${posX}% ${posY}%`;
                }
            } catch (e) {
                // Respaldo seguro si el navegador restringe la lectura de píxeles
            }
            return 'center 14%';
        }

        // Evita asignar formas ultra-estrechas o ultra-aplastadas que recortan demasiado la cabeza
        function pickCompatibleShape(img, type) {
            if (type === 'wheat') {
                return pickAbstractShape();
            }

            const ratio = img.naturalWidth / (img.naturalHeight || 1);
            let candidates = sessionShapes.filter(s => {
                if (ratio < 0.85) {
                    return ['shape-strip-v', 'shape-tall', 'shape-pillar', 'shape-sliver', 'shape-medium'].includes(s);
                } else if (ratio > 1.35) {
                    return ['shape-wide', 'shape-hero', 'shape-banner', 'shape-medium', 'shape-compact'].includes(s);
                }
                return !['shape-strip-h', 'shape-strip-v'].includes(s);
            });

            if (candidates.length === 0) candidates = sessionShapes;
            let shape = candidates[Math.floor(Math.random() * candidates.length)];
            if (shape === lastShape && candidates.length > 1) {
                shape = candidates[(candidates.indexOf(shape) + 1) % candidates.length];
            }
            lastShape = shape;
            const cut = sessionCuts[Math.floor(Math.random() * sessionCuts.length)];
            return `${shape} ${cut}`;
        }

        function createTile(item) {
            const { url, type } = item;
            const tile = document.createElement('div');
            tile.className = 'tile';

            const img = document.createElement('img');
            img.alt = '';
            img.crossOrigin = 'anonymous';
            img.referrerPolicy = 'no-referrer';
            img.decoding = 'async';
            img.fetchPriority = 'high';

            img.onload = () => {
                tile.classList.add(...pickCompatibleShape(img, type).split(' '));
                if (type === 'giraffe') {
                    img.style.objectPosition = detectGiraffeHeadFocalPoint(img);
                } else {
                    img.style.objectPosition = 'center center';
                }
                tile.classList.add('loaded');
            };

            img.onerror = () => {
                tile.remove();
            };

            tile.addEventListener('click', () => {
                openLightbox(url);
            });

            img.src = url;
            tile.appendChild(img);
            mosaic.appendChild(tile);
        }

        async function loadBatch(count = 14) {
            if (isLoadingBatch) return;
            isLoadingBatch = true;

            if (giraffeUrls.length < count / 2 || wheatUrls.length < count / 2) {
                await fetchMoreMedia();
            }

            // Mezclar el orden de aparición de cada lote manteniendo la proporción exacta 50% / 50%
            const batchItems = [];
            for (let i = 0; i < count; i++) {
                const item = popUniqueItem();
                if (!item) break;
                batchItems.push(item);
            }
            shuffle(batchItems);

            for (const item of batchItems) {
                createTile(item);
            }

            setTimeout(() => {
                isLoadingBatch = false;
                checkSentinelVisibility();
            }, 300);
        }

        function checkSentinelVisibility() {
            const rect = sentinel.getBoundingClientRect();
            if (rect.top <= window.innerHeight + 700 && (giraffeUrls.length > 0 || wheatUrls.length > 0)) {
                loadBatch(10);
            }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                loadBatch(12);
            }
        }, {
            rootMargin: '700px'
        });

        observer.observe(sentinel);

        window.addEventListener('DOMContentLoaded', async () => {
            randomizeSessionLayout();
            await fetchMoreMedia();
            loadBatch(18);
            // Precarga un segundo lote en segundo plano sin bloquear el renderizado inicial
            fetchMoreMedia();
        });
    </script>
</body>
</html>
